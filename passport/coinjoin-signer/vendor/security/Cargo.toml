# Vendored verbatim from KeyOS v1.3.1 `api/security` (sources unmodified). The
# Foundation SDK ships api/{crypto,fs,gui-server,settings,...} but no
# api/security, so an app that needs the device seed has to bring its own
# client. Only this file differs from upstream: the workspace dependencies are
# re-pointed at the SDK copies, so the crate links against the SDK's
# server/xous/crypto rather than dragging a second `keyos` package into the
# graph (the same lockfile collision the vendored getrandom avoids).
#
# Take the v1.3.1 tree, not older: the message manifest moved from `archive` to
# `blockingArchive`, which is what the SDK's server macros now expect.

[package]
name = "security"
version = "0.1.0"
edition = "2021"
description = "Secure Hardware API crate"
publish = false

[dependencies]
bip39 = "2.1"
crypto = { path = "/home/Kevin/.foundation/sdk/current/lib/keyos/api/crypto" }
log = "0.4.14"
num-derive = "0.4.2"
num-traits = "0.2.18"
rkyv = { version = "0.8.13", default-features = false, features = ["std", "bytecheck"] }
server = { path = "/home/Kevin/.foundation/sdk/current/lib/keyos/server" }
thiserror = "1.0"
xous = { path = "/home/Kevin/.foundation/sdk/current/lib/keyos/xous/xous-rs" }
zeroize = { version = "1.8.1", default-features = false, features = ["zeroize_derive"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(keyos)'] }
